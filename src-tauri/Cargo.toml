[package]
name = "quantumq"
version = "2.0.0"
edition = "2021"
description = "A puzzle game about quantum circuits and logic gates"
authors = ["Rayhan Alghiffari Azizi"]
license = "GPL-3.0-only"
build = "build.rs"

[lib]
name = "quantumq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.9.2", features = [] }
tauri-plugin-opener = "=2.4.0"
tauri-plugin-store = "=2.3.0"
