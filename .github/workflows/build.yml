name: Build QuantumQ

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: quantumq-web
          path: dist/
          if-no-files-found: error
      - name: Upload GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  desktop:
    if: github.event_name == 'workflow_dispatch'
    needs: web
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            name: windows
            path: src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: rustup update stable
      - run: cargo install tauri-cli --version 2.8.4 --locked
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml
      - run: cargo tauri build --ci -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: quantumq-${{ matrix.name }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  android:
    if: github.event_name == 'workflow_dispatch'
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: rustup update stable
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: cargo install tauri-cli --version 2.8.4 --locked
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13599879"
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13599879" >> "$GITHUB_ENV"
      - run: npm ci
      - run: cargo tauri android build --ci --debug --apk --target aarch64 --target x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: quantumq-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
